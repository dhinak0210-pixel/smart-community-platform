# Fly.io Deployment Configuration for Smart Community Platform
app = "smart-community-platform-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  APP_ENV = "production"
  DEBUG = "false"
  PORT = "7860"
