[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -x
    --color=yes
markers =
    unit: Unit tests - isolated logic, no database
    integration: Integration tests - API endpoints with database
    agents: Agent tests - AI agent behavior tests
    e2e: End-to-end tests - full user journeys
    slow: Tests that take longer than 5 seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
