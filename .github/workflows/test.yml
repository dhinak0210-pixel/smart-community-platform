name: Smart Platform Test Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio factory-boy faker regex

      - name: Run Test Suite
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          SECRET_KEY: ci-secret-key-testing-only
          APP_ENV: testing
        run: |
          python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=50
