name: Smart Platform Test Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio factory-boy faker regex

      - name: Run Test Suite
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key-testing-only
          APP_ENV: testing
        run: |
          python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=50
