name: Free Tier CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/14 * * * *"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ───────────────────────────────────────
  # JOB 1: TEST (runs on push/PR)
  # ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-free.txt
          pip install pytest pytest-asyncio httpx pytest-cov factory-boy faker freezegun

      - name: Run fast tests
        env:
          DATABASE_URL: sqlite:///./test.sqlite
          SECRET_KEY: test-secret-key-32-chars-minimum-length
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          GROQ_API_KEY: test
          RESEND_API_KEY: test
          EMAIL_FROM: test@test.com
          FRONTEND_URL: http://localhost:3000
          ML_MODE: lightweight
          DEBUG: "true"
          APP_ENV: testing
        run: |
          pytest backend/tests/unit/ backend/tests/integration/ -v --tb=short -x

      - name: Coverage check
        env:
          DATABASE_URL: sqlite:///./test.sqlite
          SECRET_KEY: test-secret-key-32-chars-minimum-length
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          GROQ_API_KEY: test
          RESEND_API_KEY: test
          EMAIL_FROM: test@test.com
          FRONTEND_URL: http://localhost:3000
          ML_MODE: lightweight
          DEBUG: "true"
          APP_ENV: testing
        run: |
          pytest backend/tests/ --cov=backend --cov-report=term-missing --cov-fail-under=50 -q -m "not slow"

  # ───────────────────────────────────────
  # JOB 2: DEPLOY BACKEND TO RENDER
  # ───────────────────────────────────────
  deploy-backend:
    name: Deploy to Render (Free)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set. Skipping automated trigger."
            exit 0
          fi
          response=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          echo "Deploy triggered. Status HTTP: $response"
          cat response.txt

      - name: Wait for deployment
        run: |
          echo "Waiting 120s for Render free build to complete..."
          sleep 120

      - name: Health check
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "No RENDER_BACKEND_URL set. Skipping health check."
            exit 0
          fi

          max_retries=5
          retry=0
          while [ $retry -lt $max_retries ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BACKEND_URL/health")
            if [ "$status" = "200" ]; then
              echo "✅ Render backend is healthy! Status: $status"
              break
            fi
            retry=$((retry + 1))
            echo "Attempt $retry failed (status: $status). Retrying in 30s..."
            sleep 30
          done

          if [ $retry -eq $max_retries ]; then
            echo "❌ Health check failed after $max_retries attempts"
            exit 1
          fi

  # ───────────────────────────────────────
  # JOB 3: DEPLOY FRONTEND TO VERCEL
  # ───────────────────────────────────────
  deploy-frontend:
    name: Deploy to Vercel (Free)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN configured. Skipping automated Vercel CLI deployment."
            exit 0
          fi
          vercel deploy frontend/ --prod --token=$VERCEL_TOKEN --yes
          echo "✅ Frontend deployed to Vercel"

  # ───────────────────────────────────────
  # JOB 4: KEEP ALIVE (Scheduled)
  # ───────────────────────────────────────
  keep-alive:
    name: Keep Render Alive
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Ping backend health
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "No RENDER_BACKEND_URL configured."
            exit 0
          fi

          echo "Pinging: $BACKEND_URL/health"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BACKEND_URL/health")
          echo "Status: $status | Time: $(date)"

          if [ "$status" = "200" ]; then
            echo "✅ Backend is awake"
          else
            echo "⚠️ Backend returned: $status (may be cold starting)"
          fi
