<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="User Profile - Smart Community Platform">
  <title>Profile - Smart Community Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top" id="main-navbar">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-houses-fill" style="font-size:1.4rem;color:var(--color-primary)"></i>
        <span class="navbar-brand-text">Smart Community</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
          <li class="nav-item d-flex gap-2" id="nav-logged-out">
            <a href="auth.html" class="btn btn-sm btn-outline-primary">Login</a>
            <a href="auth.html?tab=register" class="btn btn-sm btn-primary">Register</a>
          </li>
          <li class="nav-item d-none align-items-center gap-2" id="nav-logged-in" style="display:none">
            <a href="dashboard.html" class="btn btn-sm btn-outline-secondary d-none align-items-center gap-1" id="nav-dashboard-link" style="display:none"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <div class="dropdown">
              <button class="btn btn-sm btn-light d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown">
                <span id="nav-user-avatar"></span>
                <span id="nav-user-name" class="d-none d-md-inline">User</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PROFILE CONTENT -->
  <div class="container-fluid px-3 py-4" style="max-width:960px">
    <div id="profile-content">
      <div class="skeleton-card"><div class="skeleton-line skeleton-line-lg"></div><div class="skeleton-line skeleton-line-md"></div><div class="skeleton-line skeleton-line-sm"></div></div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div class="modal fade" id="edit-profile-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="edit-profile-form" onsubmit="handleEditProfile(event)">
            <div class="mb-3">
              <label for="edit-name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="edit-name" minlength="2" required>
            </div>
            <div class="mb-3">
              <label for="edit-bio" class="form-label">Bio</label>
              <textarea class="form-control" id="edit-bio" rows="3" maxlength="500" placeholder="Tell us about yourself..."></textarea>
            </div>
            <div class="mb-3">
              <label for="edit-phone" class="form-label">Phone</label>
              <input type="tel" class="form-control" id="edit-phone" placeholder="+1234567890">
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label for="edit-city" class="form-label">City</label>
                <input type="text" class="form-control" id="edit-city">
              </div>
              <div class="col-6">
                <label for="edit-area" class="form-label">Area</label>
                <input type="text" class="form-control" id="edit-area">
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn btn-primary w-100" id="edit-profile-btn"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- CHANGE PASSWORD MODAL -->
  <div class="modal fade" id="change-password-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-lock me-2"></i>Change Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="change-password-form" onsubmit="handleChangePassword(event)">
            <div class="mb-3">
              <label for="cp-current" class="form-label">Current Password</label>
              <input type="password" class="form-control" id="cp-current" required>
            </div>
            <div class="mb-3">
              <label for="cp-new" class="form-label">New Password</label>
              <input type="password" class="form-control" id="cp-new" required oninput="renderPasswordStrength(document.getElementById('cp-strength'), this.value)">
              <div id="cp-strength" class="mt-2"></div>
            </div>
            <div class="mb-3">
              <label for="cp-confirm" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="cp-confirm" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="cp-btn"><i class="bi bi-check-lg me-1"></i>Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issues.js"></script>

  <script>
    let _profileUser = null;
    let _isOwnProfile = false;

    document.addEventListener("DOMContentLoaded", async function () {
      await Auth.init();
      const params = new URLSearchParams(window.location.search);
      let uuid = params.get("uuid");

      /* If no UUID, show own profile */
      if (!uuid && Auth.isLoggedIn) {
        uuid = Auth.user.uuid;
      }
      if (!uuid) {
        window.location.href = "auth.html?redirect=" + encodeURIComponent(window.location.href);
        return;
      }

      try {
        _profileUser = await UsersAPI.getProfile(uuid);
        _isOwnProfile = Auth.isLoggedIn && Auth.user.uuid === uuid;
        document.title = (_profileUser.name || "Profile") + " - Smart Community Platform";
        renderProfile(_profileUser);
        loadUserIssues(uuid);
      } catch (err) {
        document.getElementById("profile-content").innerHTML =
          '<div class="empty-state"><i class="bi bi-person-x"></i><h5>User Not Found</h5><p>' + escapeHtml(err.message) + '</p><a href="index.html" class="btn btn-primary">Back to Home</a></div>';
      }
    });

    function renderProfile(user) {
      const roleBadges = { admin: 'bg-danger', authority: 'bg-primary', volunteer: 'bg-info', citizen: 'bg-secondary' };
      const container = document.getElementById("profile-content");

      const avatarHtml = user.avatar_url
        ? '<img src="' + user.avatar_url + '" alt="' + escapeHtml(user.name) + '" class="profile-avatar-lg">'
        : renderUserAvatar(user, 100);

      let editButtons = '';
      if (_isOwnProfile) {
        editButtons = '<div class="mt-3 d-flex gap-2 flex-wrap">' +
          '<button class="btn btn-sm btn-outline-primary" onclick="openEditProfile()"><i class="bi bi-pencil me-1"></i>Edit Profile</button>' +
          '<button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#change-password-modal"><i class="bi bi-lock me-1"></i>Change Password</button>' +
          '<button class="btn btn-sm btn-outline-danger" onclick="handleDeleteAccount()"><i class="bi bi-trash me-1"></i>Delete Account</button>' +
          '</div>';
      }

      container.innerHTML =
        /* Header */
        '<div class="profile-header">' +
        '<div class="position-relative d-inline-block">' + avatarHtml +
        (_isOwnProfile ? '<button class="btn btn-sm btn-primary rounded-circle position-absolute bottom-0 end-0 p-1" style="width:28px;height:28px;line-height:1" onclick="document.getElementById(\'avatar-input\').click()" title="Change photo"><i class="bi bi-camera-fill" style="font-size:0.75rem"></i></button><input type="file" id="avatar-input" accept=".jpg,.jpeg,.png,.webp" style="display:none" onchange="uploadProfileAvatar(this)">' : '') +
        '</div>' +
        '<div class="profile-info flex-fill">' +
        '<h2>' + escapeHtml(user.name) + ' <span class="badge ' + (roleBadges[user.role] || 'bg-secondary') + '" style="font-size:0.7rem;vertical-align:middle">' + (user.role || 'citizen') + '</span></h2>' +
        (user.location_city ? '<div class="text-muted"><i class="bi bi-geo-alt me-1"></i>' + escapeHtml(user.location_city) + (user.location_area ? ', ' + escapeHtml(user.location_area) : '') + '</div>' : '') +
        (user.bio ? '<p class="mt-2 mb-0">' + escapeHtml(user.bio) + '</p>' : '') +
        '<div class="text-muted small mt-1"><i class="bi bi-calendar me-1"></i>Member since ' + new Date(user.created_at).toLocaleDateString("en-US", { month: "long", year: "numeric" }) + '</div>' +
        editButtons +
        '</div></div>' +

        /* Stats */
        '<div class="d-flex gap-3 mb-4 flex-wrap profile-stats">' +
        '<div class="profile-stat-item"><div class="stat-value">' + (user.total_issues_reported || 0) + '</div><div class="stat-label">Issues</div></div>' +
        '<div class="profile-stat-item"><div class="stat-value">' + (user.total_issues_resolved || 0) + '</div><div class="stat-label">Resolved</div></div>' +
        (user.total_votes_given !== undefined ? '<div class="profile-stat-item"><div class="stat-value">' + (user.total_votes_given || 0) + '</div><div class="stat-label">Votes</div></div>' : '') +
        (user.total_comments !== undefined ? '<div class="profile-stat-item"><div class="stat-value">' + (user.total_comments || 0) + '</div><div class="stat-label">Comments</div></div>' : '') +
        '<div class="profile-stat-item"><div class="stat-value">' + Math.round(user.reputation_score || 0) + ' <i class="bi bi-star-fill" style="font-size:0.8rem;color:var(--color-warning)"></i></div><div class="stat-label">Reputation</div></div>' +
        '</div>' +

        /* Issues tabs */
        '<div class="card-elevated">' +
        '<div class="p-3 border-bottom"><h5 class="mb-0"><i class="bi bi-list-check me-2"></i>Issues by ' + escapeHtml(user.name) + '</h5></div>' +
        '<div id="profile-issues" class="p-3"></div>' +
        '<div id="profile-issues-pagination" class="p-3 pt-0"></div>' +
        '</div>';
    }

    async function loadUserIssues(uuid, page) {
      const container = document.getElementById("profile-issues");
      const paginationContainer = document.getElementById("profile-issues-pagination");
      if (!container) return;
      Loader.showSkeleton(container, 3);
      try {
        const data = await UsersAPI.getUserIssues(uuid, { page: page || 1, page_size: 10 });
        if (!data.issues || data.issues.length === 0) {
          container.innerHTML = '<div class="empty-state py-3"><i class="bi bi-inbox"></i><p class="mb-0">No issues reported yet.</p></div>';
          if (paginationContainer) paginationContainer.innerHTML = "";
          return;
        }
        container.innerHTML = '<div class="issue-grid">' + data.issues.map(renderIssueCard).join("") + '</div>';
        if (paginationContainer && data.total_pages > 1) {
          paginationContainer.innerHTML = "";
          paginationContainer.appendChild(renderPagination(data.page, data.total_pages, (p) => loadUserIssues(uuid, p)));
        } else if (paginationContainer) {
          paginationContainer.innerHTML = "";
        }
      } catch (err) {
        container.innerHTML = '<p class="text-danger">Failed to load issues.</p>';
      }
    }

    async function uploadProfileAvatar(input) {
      if (!input.files || !input.files.length) return;
      const file = input.files[0];
      try {
        Toast.info("Uploading photo...");
        const res = await API.uploadFile('/upload/avatar', file);
        Toast.success("Profile photo updated!");
        setTimeout(() => location.reload(), 800);
      } catch (err) {
        Toast.error(err.message || "Failed to update avatar.");
      }
    }

    function openEditProfile() {
      if (!_profileUser) return;
      document.getElementById("edit-name").value = _profileUser.name || "";
      document.getElementById("edit-bio").value = _profileUser.bio || "";
      document.getElementById("edit-phone").value = _profileUser.phone || "";
      document.getElementById("edit-city").value = _profileUser.location_city || "";
      document.getElementById("edit-area").value = _profileUser.location_area || "";
      new bootstrap.Modal(document.getElementById("edit-profile-modal")).show();
    }

    async function handleEditProfile(e) {
      e.preventDefault();
      const btn = document.getElementById("edit-profile-btn");
      const restore = Loader.setButtonLoading(btn, "Saving...");
      try {
        const data = {
          name: document.getElementById("edit-name").value.trim(),
          bio: document.getElementById("edit-bio").value.trim() || null,
          phone: document.getElementById("edit-phone").value.trim() || null,
          location_city: document.getElementById("edit-city").value.trim() || null,
          location_area: document.getElementById("edit-area").value.trim() || null
        };
        const updated = await AuthAPI.updateProfile(data);
        _profileUser = updated;
        Auth.user = updated;
        localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(updated));
        bootstrap.Modal.getInstance(document.getElementById("edit-profile-modal")).hide();
        Toast.success("Profile updated!");
        renderProfile(updated);
        updateNavbar();
      } catch (err) {
        Toast.error(err.message || "Failed to update profile.");
      } finally { restore(); }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const current = document.getElementById("cp-current").value;
      const newPw = document.getElementById("cp-new").value;
      const confirm = document.getElementById("cp-confirm").value;

      if (newPw !== confirm) { Toast.warning("Passwords do not match."); return; }
      const { level } = checkPasswordStrength(newPw);
      if (level === "weak") { Toast.warning("Password is too weak."); return; }

      const btn = document.getElementById("cp-btn");
      const restore = Loader.setButtonLoading(btn, "Changing...");
      try {
        await AuthAPI.changePassword(current, newPw, confirm);
        bootstrap.Modal.getInstance(document.getElementById("change-password-modal")).hide();
        Toast.success("Password changed successfully!");
        document.getElementById("change-password-form").reset();
        document.getElementById("cp-strength").innerHTML = "";
      } catch (err) {
        Toast.error(err.message || "Failed to change password.");
      } finally { restore(); }
    }

    async function handleDeleteAccount() {
      const confirmed = await Modal.confirm(
        "Delete Account",
        "This action is permanent and cannot be undone. All your data will be anonymized. Are you sure?",
        "Continue",
        true
      );
      if (!confirmed) return;

      /* Show password input modal */
      const password = await new Promise((resolve) => {
        const id = "modal-del-pw-" + Date.now();
        const html =
          '<div class="modal fade" id="' + id + '" tabindex="-1" data-bs-backdrop="static">' +
          '<div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">' +
          '<div class="modal-header"><h5 class="modal-title"><i class="bi bi-lock me-2"></i>Confirm Password</h5>' +
          '<button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>' +
          '<div class="modal-body"><p class="small text-muted">Enter your password to permanently delete your account.</p>' +
          '<input type="password" class="form-control" id="' + id + '-pw" placeholder="Your password"></div>' +
          '<div class="modal-footer">' +
          '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>' +
          '<button type="button" class="btn btn-danger" id="' + id + '-yes">Delete Account</button>' +
          '</div></div></div></div>';
        document.body.insertAdjacentHTML("beforeend", html);
        const el = document.getElementById(id);
        const bsModal = new bootstrap.Modal(el);
        el.querySelector("#" + id + "-yes").addEventListener("click", () => {
          const pw = el.querySelector("#" + id + "-pw").value;
          bsModal.hide();
          resolve(pw);
        });
        el.addEventListener("hidden.bs.modal", () => { el.remove(); resolve(null); }, { once: true });
        bsModal.show();
      });
      if (!password) return;

      try {
        await AuthAPI.deleteAccount(password, "User requested deletion");
        Toast.success("Account deleted. Redirecting...");
        Auth._clear();
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
      } catch (err) {
        Toast.error(err.message || "Failed to delete account.");
      }
    }
  </script>
</body>
</html>
