<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Community Platform | My Profile</title>

  <!-- Google Fonts & Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-buildings-fill text-primary"></i> SmartCommunity
      </a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="glass-card p-4">
          <div class="text-center mb-4">
            <div class="display-4 text-primary mb-2"><i class="bi bi-person-bounding-box"></i></div>
            <h4 class="fw-bold mb-0" id="profileName">User Name</h4>
            <span class="badge bg-primary text-uppercase mt-1" id="profileRole">Citizen</span>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small">Email Address</label>
            <input type="text" id="profileEmail" class="form-control bg-dark text-white" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small">Phone Number</label>
            <input type="text" id="profilePhone" class="form-control bg-dark text-white" readonly>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Return Home</a>
            <button class="btn btn-danger btn-sm" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.isAuthenticated()) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/users/me`, {
          headers: Auth.getAuthHeader(),
        });
        const user = await res.json();
        document.getElementById('profileName').textContent = user.full_name;
        document.getElementById('profileEmail').value = user.email;
        document.getElementById('profilePhone').value = user.phone || 'Not provided';
        document.getElementById('profileRole').textContent = user.role;
      } catch (err) {
        console.error('Failed to load profile:', err);
      }
    });
  </script>
</body>
</html>
