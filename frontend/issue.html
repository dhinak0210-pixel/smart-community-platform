<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Community Platform | Issue Details</title>

  <!-- Google Fonts & Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-buildings-fill text-primary"></i> SmartCommunity
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Live Map</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Analytics</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Map</a>
            <span class="badge badge-reported fs-6" id="issueDetailStatus">Reported</span>
          </div>

          <h3 class="fw-bold mb-2 text-white" id="issueDetailTitle">Loading issue...</h3>
          <p class="text-secondary small mb-3">
            <i class="bi bi-geo-alt-fill text-primary me-1"></i> <span id="issueDetailAddress">...</span> &bull; 
            <i class="bi bi-tag-fill ms-2 me-1 text-info"></i> <span id="issueDetailCategory">...</span>
          </p>

          <div class="p-3 rounded bg-dark bg-opacity-50 mb-4 text-light" id="issueDetailDescription">
            Loading issue details...
          </div>

          <div class="d-flex gap-2 mb-4">
            <button class="btn btn-outline-info btn-sm" id="btnGetAiPlan">
              <i class="bi bi-robot me-1"></i> Generate AI Dispatch Action Plan
            </button>
          </div>

          <!-- AI Plan Container -->
          <div id="aiPlanContainer" class="p-3 glass-card mb-4 d-none">
            <h6 class="fw-bold text-info mb-2"><i class="bi bi-cpu-fill me-1"></i> AI Resolver Action Plan</h6>
            <ol id="aiPlanSteps" class="small mb-0 text-light"></ol>
          </div>

          <!-- Comments Section -->
          <div class="border-top border-secondary pt-4 mt-2">
            <h5 class="fw-bold mb-3"><i class="bi bi-chat-left-text-fill me-2 text-primary"></i>Discussion & Comments</h5>
            <div id="commentsList" class="mb-4">
              <p class="text-muted small">No comments yet.</p>
            </div>

            <!-- Add Comment Form -->
            <form id="formAddComment">
              <div class="input-group">
                <input type="text" id="commentText" class="form-control bg-dark text-white" placeholder="Write a community comment..." required>
                <button class="btn btn-primary-custom" type="submit">Post Comment</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const issueId = urlParams.get('id') || 1;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadIssueDetail();

      document.getElementById('btnGetAiPlan').addEventListener('click', async () => {
        try {
          const res = await fetch(`${CONFIG.API_BASE_URL}/agents/resolution-plan/${issueId}`, {
            method: 'POST',
            headers: Auth.getAuthHeader(),
          });
          const plan = await res.json();
          const container = document.getElementById('aiPlanContainer');
          const stepsOl = document.getElementById('aiPlanSteps');
          stepsOl.innerHTML = plan.resolution_steps.map(s => `<li class="mb-1">${s}</li>`).join('');
          container.classList.remove('d-none');
        } catch (err) {
          alert('Could not fetch AI plan.');
        }
      });

      document.getElementById('formAddComment').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!Auth.isAuthenticated()) {
          alert('Please login first to comment.');
          return;
        }
        const content = document.getElementById('commentText').value;
        try {
          await fetch(`${CONFIG.API_BASE_URL}/issues/${issueId}/comments`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...Auth.getAuthHeader(),
            },
            body: JSON.stringify({ content }),
          });
          document.getElementById('commentText').value = '';
          loadIssueDetail();
        } catch (err) {
          alert('Failed to post comment.');
        }
      });
    });

    async function loadIssueDetail() {
      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/issues/${issueId}`);
        const issue = await res.json();
        document.getElementById('issueDetailTitle').textContent = issue.title;
        document.getElementById('issueDetailAddress').textContent = issue.address || 'GPS Coordinates';
        document.getElementById('issueDetailCategory').textContent = issue.category.replace('_', ' ').toUpperCase();
        document.getElementById('issueDetailStatus').textContent = issue.status.replace('_', ' ').toUpperCase();
        document.getElementById('issueDetailDescription').textContent = issue.description;
      } catch (err) {
        console.error('Error loading issue:', err);
      }
    }
  </script>
</body>
</html>
