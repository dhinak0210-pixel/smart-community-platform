<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Community Platform | Issue Details</title>

  <!-- Google Fonts & Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-buildings-fill text-primary"></i> SmartCommunity
      </a>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Map</a>
            <span class="badge badge-reported" id="issueDetailStatus">Reported</span>
          </div>

          <h3 class="fw-bold mb-2" id="issueDetailTitle">Issue Title Placeholder</h3>
          <p class="text-secondary small mb-4">
            <i class="bi bi-geo-alt-fill text-primary me-1"></i> <span id="issueDetailAddress">Location address</span> &bull; 
            <i class="bi bi-clock-fill me-1"></i> <span id="issueDetailDate">Reported date</span>
          </p>

          <div class="p-3 rounded bg-dark bg-opacity-50 mb-4" id="issueDetailDescription">
            Issue description content goes here...
          </div>

          <div class="border-top border-secondary pt-3 mt-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-chat-left-text-fill me-2 text-primary"></i>Discussion & Comments</h5>
            <div id="commentsList" class="mb-3">
              <p class="text-muted small">No comments yet.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
