services:
  - type: web
    name: smart-community-api
    runtime: python
    region: oregon
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-free.txt
      python scripts/download_models_lite.py

    startCommand: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --log-level info
      --timeout-keep-alive 75

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: ML_DEVICE
        value: cpu
      - key: ML_MODE
        value: lightweight
      - key: HUGGINGFACE_MODEL_CACHE_DIR
        value: /opt/render/project/ml_models
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

    autoDeploy: true

    disk:
      name: ml-models-cache
      mountPath: /opt/render/project/ml_models
      sizeGB: 1
